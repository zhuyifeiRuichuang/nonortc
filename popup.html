<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nonortc 隐私防护</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; width: 320px; margin: 0; padding: 14px 16px; color: #1a1a1a; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .row:last-child { border-bottom: none; }
    .label { font-size: 13px; }
    .sub { font-size: 11px; color: #888; margin-top: 2px; }
    .site { font-size: 12px; color: #444; word-break: break-all; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 22px; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #2b7de9; }
    input:checked + .slider:before { transform: translateX(18px); }
    a { color: #2b7de9; font-size: 12px; text-decoration: none; }
    .footer { margin-top: 10px; text-align: right; }
    .badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; }
    .on { background:#e6f4ea; color:#1e7e34; }
    .off { background:#fdecea; color:#c0392b; }
  </style>
</head>
<body>
  <h1>nonortc 隐私防护</h1>

  <div class="row">
    <div>
      <div class="label">全局防护开关</div>
      <div class="sub">真实IP / WebRTC / DNS 全局强制，并作为各站点默认</div>
    </div>
    <label class="switch"><input type="checkbox" id="globalToggle"><span class="slider"></span></label>
  </div>

  <div class="row">
    <div>
      <div class="label">当前站点防护</div>
      <div class="site" id="siteHost">—</div>
      <div class="sub">仅作用于本站的 时区 / 语言 / 地理定位（不含 WebRTC/DNS）</div>
    </div>
    <label class="switch"><input type="checkbox" id="siteToggle"><span class="slider"></span></label>
  </div>

  <div class="row">
    <div class="label">防护状态</div>
    <span class="badge off" id="statusBadge">未启用</span>
  </div>

  <div class="footer">
    <a href="#" id="openOptions">高级设置</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
